<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.svg">

</head>
<body>
    
    <nav class="flex-horizontal">
        <div class="image-template">
            <img class="logo" src="images/thespot_logo.svg">

        </div>
        <ul class="flex-horizontal navbar">

            </li>
            <li>about</li>
            <li>apply</li>

    <section class="imageboard" id="board1">

                <span>featured</span>
                <img src="images/featuredarrows.svg">

                <img class="fullscreen-icon" src="images/image-expand.svg">

                <img class="unique-image shadow" src="images/art/2.3_placeholder.png">

            <dialog id="expand-dialogue" >

                    <h1>Temporary Title</h1>
                    <img src="images/art/2.3_placeholder.png">
