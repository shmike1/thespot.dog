<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="image-template">
        <img class="temp" src="images/art/2.3_placeholder.png">
        <img class="temp shadow" src="images/art/2.3_placeholder.png">
        <img class="expand-icon" src="images/image-expand.svg">
    </div>
    <div style="position:relative;">
        <h1> text test</h1>
        <h1 style="position: absolute; top: 5px; left: 5px; filter: blur(2px) opacity(0.5)"> text test</h1>
    </div>
    <button class="flex-horizontal" id="featured" type="dialog">
        <span>featured</span>
        <img src="images/featuredarrows.svg">
    </button>

    <button command="show-modal" commandfor="my-dialog">Open dialog</button>

    <dialog id="my-dialog">
        <p>Opened entirely via HTML attributes.</p>
        <button commandfor="my-dialog" command="close">Close</button>
    </dialog>

    
</body>

</html>
